name: e2e tests

on:
  push:
    branches:
      - main
      - e2e-gpu-recordings-gha
  workflow_dispatch:

concurrency:
  group: e2e-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COMPOSE_FILE: docker-compose.yml:docker-compose-cosmos-db.yml:docker-compose-service-bus.yml
  WEBVIZ_SKIP_AZURE_CREDENTIAL_CREATION: true
  WEBVIZ_LOCAL_DEVELOPER_QUALIFIER: NoDeveloper
  WEBVIZ_SMDA_SUBSCRIPTION_KEY: 0
  WEBVIZ_ENTERPRISE_SUBSCRIPTION_KEY: 0
  WEBVIZ_VDS_HOST_ADDRESS: 0
  WEBVIZ_PSEUDONYM_HMAC_KEY: 0
  WEBVIZ_SESSION_STORE_FERNET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  WEBVIZ_SERVICE_BUS_PAYLOAD_FERNET_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  WEBVIZ_REDIS_AUTH_STORE_PASSWORD: 0
  WEBVIZ_REDIS_CACHE_PASSWORD: 0
  WEBVIZ_SUMO_ENV: prod

jobs:
  e2e_tests:
    # The Sumo shared key secret is only available on the upstream repo, so skip on forks.
    if: github.repository == 'equinor/webviz'
    name: e2e tests (no record, no gpu)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: 📖 Checkout commit locally
        uses: actions/checkout@v4

      # Touch the weekly recording caches on push to main so GitHub's 7-day cache eviction
      # doesn't expire the Kokoro TTS model or synthesized narration audio between Sunday runs.
      - name: 🧠 Keep Kokoro TTS model cache warm
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-kokoro-82m-v1.0-onnx

      - name: 📦 Keep CPU narration audio cache warm
        uses: actions/cache/restore@v4
        with:
          path: frontend/.narration-cache
          key: narration-audio-cpu-keepalive
          restore-keys: narration-audio-cpu-

      - name: 📦 Keep GPU narration audio cache warm
        uses: actions/cache/restore@v4
        with:
          path: frontend/.narration-cache
          key: narration-audio-gpu-keepalive
          restore-keys: narration-audio-gpu-

      - name: 🐳 Setup e2e stack
        timeout-minutes: 25
        uses: ./.github/actions/setup-e2e-stack

      - name: 🧪 Run e2e tests (no recording)
        working-directory: ./frontend
        timeout-minutes: 30
        env:
          CI: "true"
          SHARED_KEY_DROGON_READ_PROD: ${{ secrets.SHARED_KEY_DROGON_READ_PROD }}
        run: npm run test:e2e

      - name: 🐳 Dump docker compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: 🎭 Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-e2e-tests
          path: frontend/test-results/**/trace.zip
          retention-days: 1
          if-no-files-found: ignore

      - name: 🧹 Tear down the stack
        if: always()
        run: docker compose down --volumes
